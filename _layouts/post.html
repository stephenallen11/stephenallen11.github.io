---
layout: default
---
<article class="row lead">
  <div class="rail">
    <a href="{{ '/posts/' | relative_url }}">&larr; Posts</a>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %b %Y' }}</time>
    {%- for tag in page.tags %}<span>{{ tag }}</span>{% endfor %}
  </div>
  <div>
    <h1 class="page-title">{{ page.title }}</h1>
    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>
