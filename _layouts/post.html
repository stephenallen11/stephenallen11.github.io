---
layout: default
---
<article>
  <a class="back" href="{{ '/posts/' | relative_url }}">&larr; Posts</a>
  <h1>{{ page.title }}</h1>
  <p class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time>
    {%- if page.tags.size > 0 %} &middot; {{ page.tags | join: ', ' }}{% endif %}
  </p>
  <div class="prose">
    {{ content }}
  </div>
</article>
