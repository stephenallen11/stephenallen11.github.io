<ul class="entries">
  {%- for project in include.projects %}
  <li>
    {% if project.url %}<a class="title" href="{{ project.url }}">{{ project.name }}</a>{% else %}<span class="title">{{ project.name }}</span>{% endif %}
    <span class="date">{{ project.year }}</span>
    {%- if project.description %}<p>{{ project.description }}</p>{% endif %}
  </li>
  {%- endfor %}
</ul>
