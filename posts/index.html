---
layout: default
title: Posts
---
<div class="row lead">
  <div class="rail"></div>
  <h1 class="page-title">Posts</h1>
</div>
{% assign by_year = site.posts | group_by_exp: 'post', 'post.date | date: "%Y"' %}
{% for year in by_year %}
<section class="row">
  <h2 class="label">{{ year.name }}</h2>
  <div>{% include post-list.html posts=year.items %}</div>
</section>
{% endfor %}
